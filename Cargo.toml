[package]
name = "graftr"
version = "0.1.2"
edition = "2024"
publish = false
description = "Prepare, freeze and retire Git worktrees and development environments"
license = "MIT"
repository = "https://github.com/JavanFriedel/graftr"
readme = "README.md"

[[bin]]
name = "graftr"
path = "src/main.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
libc = "0.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "preserve_order"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
regex = "=1.13.1"
sha2 = "=0.10.9"
url = "=2.5.8"
icu_collator = "=2.4.0"
icu_properties = "=2.4.0"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
