name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust checks
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: ./build.sh
      - run: python3 -m unittest discover -s tests/cli -p 'test_*.py'
      - run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
      - run: python3 -m unittest discover -s tests/build -p 'test_*.py'
      - run: python3 tests/check-native-build.py
      - run: git diff --exit-code
