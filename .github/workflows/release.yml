name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install native release toolchain and its license notices
        run: |
          rustup toolchain install stable --profile minimal --component rust-docs
          rustup default stable
      - name: Package exact tag with notices and checksums
        run: python3 scripts/package-release.py --tag "$GITHUB_REF_NAME"
      - name: Create draft for explicit review and publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/*.tar.gz dist/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Graftr $GITHUB_REF_NAME" \
            --notes "Linux x86_64 GNU release built on Ubuntu 22.04. Includes the native executable, source revision, checksums, completion, plugin manifest and dependency license notices. Review SHA256SUMS before installation."
